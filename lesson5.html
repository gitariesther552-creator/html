<html>
    <head>
        <title> Lesson five- Forms</title>
    </head>

    <body>
        <center><h1> HTML Forms </h1></center>

        <!-- Html forms are used to collect user data and store the same data inside of a data base. forms in html are introduced by the use of the form tag element. to have a partition inside a form we use the fieldset tag element. To label\ give a heading to the partition we use the legend tag element. A form uses different input types to collect the user data i.e; ntext, email, password, date, file etc;  -->

        <form >
            <!-- first partition starts here -->
          <fieldset>
            <legend> Personal Details </legend>

            <input type="text" placeholder="Enter the ful names"> <br> <br>

            <input type="number" placeholder=" Enter your ID number"> <br> <br>

            <input type="email" placeholder="Enter the email adress"> <br> <br>

            <input type=" Password" placeholder=" Enter your password"> <br> <br>

            <label > Your D.O.B </label> <br>
            <input type="date">

          </fieldset>
          <!-- first partition ends here -->

           <!-- Second partition starts here -->
            <fieldset>
                <legend> Selections </legend>

                <label> Your interests\Hobbies </label> <br>
                <input type="checkbox">Swimming <br>
                <input type="checkbox">Riding <br>
                <input type="checkbox">Reading <br>
                <input type="checkbox">Coding <br> <br>

                <label > Your Gender</label> <br>
                <input type="radio" name="Gender"> Male <br>
                <input type="radio" name="Gender"> Female <br> <br>

                <label > Chose your profile picture</label> <br>
                <input type="file"> <br><br>

                <label > Select a course</label> <br>
                <select >
                    <option value="0"> Choose a course </option>
                    <option value="1"> Computer science </option>
                    <option value="2"> Bachelors Business Information Technology</option>
                    <option value="3"> Bachelors of Information Technology </option>
                </select>
             </fieldset>
           <!-- second partition ends here -->
            <!-- Third partition starts here  -->
             <fieldset>
                  <legend> Feedback </legend>

                  <label > Leave a comment</label> <br>
                  <textarea cols="80" rows="5" placeholder=" Type your feedback here ...."></textarea>
             </fieldset>
             <!-- end of third partition  -->
              <input type="submit" value="Make Application"> <br><br>
              <input type="reset">
        </form>
    </body>
</html>
